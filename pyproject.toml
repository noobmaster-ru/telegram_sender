[project]
name = "telegram-sender"
version = "0.1.0"
description = "telegram-sender scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gspread>=6.2.1",
    "python-dotenv>=1.2.1",
    "telethon==1.42.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
