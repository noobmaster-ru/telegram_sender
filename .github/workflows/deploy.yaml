name: Deploy sender

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-sender
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SENDER_HOST }}
          username: ${{ secrets.SENDER_USER }}
          key: ${{ secrets.SENDER_SSH_KEY }}
          command_timeout: 15m
          # Сервис app намеренно не поднимаем: его запуск = немедленная рассылка.
          # Код монтируется volume-ом, так что плановые запуски ofelia подхватят
          # новые файлы сразу; пересборка образа нужна только ради зависимостей.
          # reset вместо pull: локальные/недокоммиченные файлы на сервере не должны ронять деплой.
          script: |
            set -e
            cd ~/telegram_sender
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            docker compose build app
            docker compose up -d scheduler
            docker image prune -f
