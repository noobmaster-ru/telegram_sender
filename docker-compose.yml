services:
  app:
    build: .
    image: telegram-sender-app
    volumes:
      - .:/app
    # На деплое (docker compose up) шлёт "Бот задеплоен" и сразу делает полную рассылку.
    # Дальше рассылки запускает ofelia (job-run) по расписанию ниже.
    command: ["sh", "-c", "uv run notify_deploy.py && uv run main.py"]
    restart: "no"
  scheduler:
    image: mcuadros/ofelia:latest
    restart: always
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Europe/Moscow 
    labels:
      - "ofelia.enabled=true"
      # Используем job-run: это создаст новый контейнер из образа
      # Каждый день в 7:00, 12:00, 16:00, 19:00 и 21:00 МСК (старт рассылок — 8 сентября).
      - "ofelia.job-run.telegram-task.schedule=0 0 7,12,16,19,21 * * *"
      - "ofelia.job-run.telegram-task.image=telegram-sender-app"
      # Прокидываем volume, чтобы сессия сохранялась (важно!)
      - "ofelia.job-run.telegram-task.volume=${PWD}:/app"
      # Каждый день в 14:00 МСК — один пост в чаты папки «Раздачи 1раз» (правила: 1 пост в день, не ночью).
      # 14:00 — между рассылками 12:00 и 16:00, чтобы две рассылки не работали с одной сессией одновременно.
      - "ofelia.job-run.telegram-task-daily.schedule=0 0 14 * * *"
      - "ofelia.job-run.telegram-task-daily.image=telegram-sender-app"
      - "ofelia.job-run.telegram-task-daily.command=uv run python main.py --daily"
      - "ofelia.job-run.telegram-task-daily.volume=${PWD}:/app"
      # Каждый день в 23:30 МСК обновляем targets.txt и targets_daily.txt из папок Telegram
      - "ofelia.job-run.update-targets.schedule=0 30 23 * * *"
      - "ofelia.job-run.update-targets.image=telegram-sender-app"
      - "ofelia.job-run.update-targets.command=uv run python export_folder_chats.py"
      - "ofelia.job-run.update-targets.volume=${PWD}:/app"