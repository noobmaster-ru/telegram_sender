services:
  app:
    build: .
    image: telegram-sender-app
    volumes:
      - .:/app
    # Собирает образ для планировщика; сам не рассылает при docker compose up.
    # Реальные рассылки запускает ofelia (job-run) по расписанию ниже.
    command: ["true"]
    restart: "no"
  scheduler:
    image: mcuadros/ofelia:latest
    restart: always
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Europe/Moscow 
    labels:
      - "ofelia.enabled=true"
      # Используем job-run: это создаст новый контейнер из образа
      # Раз в 4 дня в 10:00 МСК (числа месяца 1,5,9,...29; на стыке месяцев интервал может быть короче)
      - "ofelia.job-run.telegram-task.schedule=0 0 10 */4 * *"
      - "ofelia.job-run.telegram-task.image=telegram-sender-app"
      # Прокидываем volume, чтобы сессия сохранялась (важно!)
      - "ofelia.job-run.telegram-task.volume=${PWD}:/app"