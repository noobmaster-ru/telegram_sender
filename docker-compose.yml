services:
  app:
    build: .
    image: telegram-sender-app
    volumes:
      - .:/app
    # На деплое (docker compose up) шлёт уведомление "Бот задеплоен" в канал отчётов и выходит.
    # Рассылку по каналам НЕ делает — её запускает ofelia (job-run) по расписанию ниже.
    command: ["uv", "run", "notify_deploy.py"]
    restart: "no"
  scheduler:
    image: mcuadros/ofelia:latest
    restart: always
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Europe/Moscow 
    labels:
      - "ofelia.enabled=true"
      # Используем job-run: это создаст новый контейнер из образа
      # Каждый день в 7:00, 12:00, 16:00, 19:00 и 21:00 МСК (старт рассылок — 8 сентября).
      - "ofelia.job-run.telegram-task.schedule=0 0 7,12,16,19,21 * * *"
      - "ofelia.job-run.telegram-task.image=telegram-sender-app"
      # Прокидываем volume, чтобы сессия сохранялась (важно!)
      - "ofelia.job-run.telegram-task.volume=${PWD}:/app"